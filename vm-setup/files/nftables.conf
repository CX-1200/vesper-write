#!/usr/sbin/nft -f
# /etc/nftables.conf — Vesper VM firewall (vm-setup/05-firewall.md explains every rule)
#
# Inbound:  everything dropped except SSH (and ping) from the Windows host.
# Outbound: the vesper user (worker, claude, vesper CLI) may only talk to the
#           local proxy on 127.0.0.1:3128; every other connection it tries,
#           including DNS, is refused and logged. Other users are unaffected
#           (apt, NTP and squid itself keep working).

flush ruleset

# The Windows host's address on the VMware NAT network (ipconfig → "VMnet8"), e.g. 192.168.80.1
define ADMIN_HOST = <host-vmnet8-ip>

table inet vesper {
	chain input {
		type filter hook input priority filter; policy drop;

		ct state established,related accept
		ct state invalid drop
		iifname "lo" accept

		# IPv6 needs ICMPv6 (neighbour discovery) to work at all.
		meta l4proto ipv6-icmp accept

		# DHCP replies from VMware's NAT DHCP server (address lease renewals).
		udp sport 67 udp dport 68 accept

		# Ping and SSH, only from the Windows host.
		ip saddr $ADMIN_HOST icmp type echo-request accept
		ip saddr $ADMIN_HOST tcp dport 22 ct state new accept

		# Everything else is dropped (the counter shows how much).
		counter drop
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy accept;

		# The vesper user: only the local proxy.
		meta skuid "vesper" ip daddr 127.0.0.1 tcp dport 3128 accept
		meta skuid "vesper" limit rate 6/minute burst 10 packets log prefix "vesper-egress-blocked: " level warn
		meta skuid "vesper" counter reject with icmpx type admin-prohibited
	}
}
