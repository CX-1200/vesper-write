# /etc/squid/squid.conf — Vesper VM outbound proxy (vm-setup/04-proxy.md)
#
# Only the local machine may use it, only HTTPS tunnels (CONNECT to port 443),
# and only to the host names listed below (Build Spec §16.4). Everything else
# is refused with 403. Nothing is cached. The access log records which host
# was contacted (never content: the tunnels are TLS-encrypted end to end).

# Listen on loopback only: nothing outside the VM can use this proxy.
http_port 127.0.0.1:3128

# --- allowlist: exact host names (a leading dot would also allow subdomains; we never use one) ---
acl vesper_allowed dstdomain api.anthropic.com
acl vesper_allowed dstdomain platform.claude.com
acl vesper_allowed dstdomain claude.ai
# Your Vercel deployment, exactly as in /etc/vesper/worker.json (no https://, no path):
acl vesper_allowed dstdomain <your-vercel-domain>

acl SSL_ports port 443
acl CONNECT method CONNECT

# Order matters: the first matching line decides.
http_access deny !CONNECT
http_access deny CONNECT !SSL_ports
http_access allow localhost vesper_allowed
http_access deny all

# No caching. (Headers are not touched: CONNECT tunnels are opaque TLS, the proxy never sees them.)
cache deny all

# One line per connection: time, client, result, bytes, CONNECT host:443.
access_log daemon:/var/log/squid/access.log squid
coredump_dir /var/spool/squid
shutdown_lifetime 3 seconds
