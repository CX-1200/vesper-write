# /etc/ssh/sshd_config.d/10-vesper.conf
# Vesper VM: SSH only with keys, only for the admin account (vm-setup/03-ssh.md).
# sshd uses the FIRST value it reads for each option, and files in
# sshd_config.d are read in name order before the rest of sshd_config,
# so "10-" makes these lines win over later defaults (e.g. 50-cloud-init.conf).

# Only public keys; no passwords, no keyboard-interactive prompts.
PubkeyAuthentication yes
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no

# Nobody logs in as root, and only your admin account may log in at all
# (the vesper service user can never log in remotely).
PermitRootLogin no
AllowUsers <your-admin-user>

# This VM never needs forwarding of any kind.
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
AllowStreamLocalForwarding no
PermitTunnel no
GatewayPorts no

# Slow down guessing.
MaxAuthTries 3
LoginGraceTime 30
MaxStartups 3:50:10

# Optional (see 03-ssh.md §5): listen only on the NAT address. Needs a static IP.
# ListenAddress <vm-nat-ip>
